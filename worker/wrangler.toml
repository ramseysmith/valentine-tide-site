name = "valentine-tide-shop"
main = "src/index.js"
compatibility_date = "2026-09-01"
# Keep variables and secrets added in the Cloudflare dashboard when GitHub
# pushes redeploy the worker (otherwise dashboard text variables are wiped).
keep_vars = true

# Serve the worker at shop.valentinetide.com once the domain is on Cloudflare,
# or use the default *.workers.dev URL and paste it into config.js (API_BASE).
# routes = [{ pattern = "shop.valentinetide.com", custom_domain = true }]

# Every 30 minutes the worker nudges the X agent (only if AGENT_DISPATCH_TOKEN is set).
[triggers]
crons = ["*/30 * * * *"]

[vars]
SITE_URL = "https://valentinetide.com"
ALLOWED_ORIGINS = "https://valentinetide.com,https://www.valentinetide.com,http://localhost:8000"
# Printful charges your card the moment an order is confirmed. Set to "false"
# to land orders as drafts you approve in the Printful dashboard instead.
PRINTFUL_AUTO_CONFIRM = "false"
# Turn on after enabling Stripe Tax (Dashboard > Tax) and registering in Colorado.
STRIPE_AUTOMATIC_TAX = "false"
# Ask buyers to opt into marketing emails at checkout. Accept Stripe's checkout
# terms first (Dashboard > Settings > Checkout), then set to "true".
STRIPE_PROMO_CONSENT = "false"
ALLOW_UNMAPPED = "false"

# Email list (optional). Without it the worker still sells; the site keeps
# sending signups through FormSubmit. To store signups here instead, create
# the namespace (npx wrangler kv namespace create SUBSCRIBERS) and uncomment:
# [[kv_namespaces]]
# binding = "SUBSCRIBERS"
# id = "PASTE_THE_ID_HERE"

# Secrets (set with `npx wrangler secret put NAME`, never commit them):
#   STRIPE_SECRET_KEY      sk_test_... first, sk_live_... when you launch
#   STRIPE_WEBHOOK_SECRET  whsec_... from the webhook endpoint you create
#   PRINTFUL_TOKEN         Printful private token
#   PRINTFUL_STORE_ID      only needed for an account level token
#   AGENT_DISPATCH_TOKEN   optional: GitHub fine grained token (Actions read and write on
#                          valentine-tide-agent) so the X agent runs on time
