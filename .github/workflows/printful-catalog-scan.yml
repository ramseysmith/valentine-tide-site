name: Printful catalog scan

# Lists Printful products that could join the line, with base cost, and
# commits the result to the "research" branch (never main).

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PRINTFUL_TOKEN: ${{ secrets.PRINTFUL_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node worker/scripts/catalog-scan.mjs
      - name: Commit to the research branch
        run: |
          git config user.name "Ramsey Graysmith"
          git config user.email "smith.s.ramsey@gmail.com"
          git checkout -B research
          git add research
          git commit -m "Printful catalog scan"
          git push -f origin research
